## Settings file was created by plugin Valheim Auto Cleanup v1.0.1
## Plugin GUID: io.github.macromaster101.valheimautocleanup
##
## This is a copy of the file the plugin generates on its first run, for reference.
## The live file lives at:  BepInEx/config/io.github.macromaster101.valheimautocleanup.cfg
##
## After editing the live file you can apply the change without restarting the server:
## write "reload" into BepInEx/config/autocleanup.command.txt and save it.

[General]

## Master switch. When false the plugin loads but never scans or removes anything.
# Setting type: Boolean
# Default value: true
Enabled = true

## How often, in real seconds, a cleanup pass runs.
# Setting type: Int32
# Default value: 600
# Acceptable value range: From 60 to 86400
CleanupIntervalSeconds = 600

## An item must have existed for at least this many seconds of WORLD time before it can be removed. World time only advances while at least one player is connected, so items do not age on an empty server. This is what stops loot dropped moments before a scan from disappearing.
# Setting type: Int32
# Default value: 600
# Acceptable value range: From 0 to 604800
MinimumItemAgeSeconds = 600

## SAFETY DEFAULT. When true the plugin performs the full scan and reports what it WOULD remove but removes nothing. Back up your world, watch the logs for at least one cycle, then set this to false.
# Setting type: Boolean
# Default value: true
DryRun = true

## Run one cleanup pass shortly after the world finishes loading.
# Setting type: Boolean
# Default value: false
RunCleanupOnServerStart = false

## Seconds to wait after the world is ready before the first pass runs.
# Setting type: Int32
# Default value: 120
# Acceptable value range: From 0 to 86400
StartupCleanupDelaySeconds = 120

## Very conservative mode: scheduled passes only run when no players are connected. Manual admin commands still work. Note that world time is frozen on an empty server, so items stop ageing while nobody is online.
# Setting type: Boolean
# Default value: false
OnlyCleanupWhenServerEmpty = false

[PlayerProtection]

## Never remove an item that a connected player is standing near.
# Setting type: Boolean
# Default value: true
ProtectNearPlayers = true

## Radius in metres around every connected player inside which items are never removed.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 0 to 10000
PlayerProtectionRadius = 25

## Keep protecting an item for a while after the last player leaves its radius, so loot does not vanish the instant someone walks away.
# Setting type: Boolean
# Default value: true
ProtectRecentlyNearbyItems = true

## How long, in real seconds, that after-the-fact protection lasts.
# Setting type: Int32
# Default value: 180
# Acceptable value range: From 0 to 86400
RecentPlayerProtectionSeconds = 180

[BaseProtection]

## Never remove items near player-built structures. Off by default because many public servers specifically want litter cleared inside settlements.
# Setting type: Boolean
# Default value: false
ProtectNearPlayerBase = false

## Radius in metres around a player-built piece inside which items are protected.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 10000
BaseProtectionRadius = 15

## Never remove items inside an active PrivateArea (ward).
# Setting type: Boolean
# Default value: false
ProtectItemsInsideActiveWards = false

## Never remove items near the world spawn / starting stones. Useful for public meeting areas.
# Setting type: Boolean
# Default value: false
ProtectNearWorldSpawn = false

## Radius in metres around the world spawn point.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 0 to 10000
WorldSpawnProtectionRadius = 50

[ItemProtection]

## Apply the ImportantItemWhitelist below.
# Setting type: Boolean
# Default value: true
ProtectImportantItems = true

## Comma-separated prefab names that must never be removed. Case-insensitive, whitespace trimmed. The defaults are boss progression items, boss trophies, progression keys and quest fragments.
# Setting type: String
# Default value: DragonEgg,Wishbone,YagluthDrop,QueenDrop,FaderDrop,FrozenKingDrop,TrophyEikthyr,TrophyTheElder,TrophyBonemass,TrophyDragonQueen,TrophyGoblinKing,TrophySeekerQueen,TrophyFader,ShieldCore,BellFragment,MorgenHeart,CryptKey,DvergrKeyFragment,DvergrKey,BloodGoldKey,HildirKey_forestcrypt,HildirKey_mountaincave,HildirKey_plainsfortress,DyrnwynBladeFragment,DyrnwynHiltFragment,DyrnwynTipFragment
ImportantItemWhitelist = DragonEgg,Wishbone,YagluthDrop,QueenDrop,FaderDrop,FrozenKingDrop,TrophyEikthyr,TrophyTheElder,TrophyBonemass,TrophyDragonQueen,TrophyGoblinKing,TrophySeekerQueen,TrophyFader,ShieldCore,BellFragment,MorgenHeart,CryptKey,DvergrKeyFragment,DvergrKey,BloodGoldKey,HildirKey_forestcrypt,HildirKey_mountaincave,HildirKey_plainsfortress,DyrnwynBladeFragment,DyrnwynHiltFragment,DyrnwynTipFragment

## Comma-separated prefab names that must never be removed, for example Iron,BlackMetal. This list is an absolute veto and is checked before every other rule.
# Setting type: String
# Default value:
Whitelist =

## Conservative mode. When true, ONLY prefabs named in Blacklist can ever be removed; everything else is left alone regardless of age.
# Setting type: Boolean
# Default value: false
BlacklistOnly = false

## Comma-separated prefab names. Only meaningful when BlacklistOnly is true.
# Setting type: String
# Default value: Wood,Stone,Resin,BoneFragments
Blacklist = Wood,Stone,Resin,BoneFragments

## Never remove weapons, shields, armour, tools, torches, trinkets or utility gear. Ammo is deliberately NOT treated as equipment, since spent arrows are the most common form of litter.
# Setting type: Boolean
# Default value: true
ProtectEquipment = true

## Never remove an item whose quality (upgrade level) is above 1.
# Setting type: Boolean
# Default value: true
ProtectUpgradedItems = true

## Never remove a drop whose stack size is at or above LargeStackThreshold. Guards against wiping a large resource transfer somebody left on the ground.
# Setting type: Boolean
# Default value: false
ProtectLargeStacks = false

## Stack size at which ProtectLargeStacks takes effect.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 1 to 100000
LargeStackThreshold = 100

## Never remove live fish. Fish prefabs carry an ItemDrop component, so without this they would look like ordinary loose drops. Strongly recommended to leave on.
# Setting type: Boolean
# Default value: true
ProtectFish = true

[Performance]

## Hard ceiling on removals in a single pass.
# Setting type: Int32
# Default value: 250
# Acceptable value range: From 1 to 100000
MaxDeletesPerCleanup = 250

## Removals performed before the coroutine yields back to the game loop.
# Setting type: Int32
# Default value: 25
# Acceptable value range: From 1 to 5000
DeletesPerFrame = 25

## Pause between removal batches, in milliseconds.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 0 to 5000
DelayBetweenDeleteBatchesMilliseconds = 50

[Warnings]

## Announce upcoming cleanups. Messages are shown through Valheim's own on-screen message system, so vanilla clients see them with no mod installed. If broadcasting is unavailable the warnings still appear in the server log.
# Setting type: Boolean
# Default value: true
EnableCleanupWarnings = true

## Lead time for the first warning. Must be less than CleanupIntervalSeconds.
# Setting type: Int32
# Default value: 60
# Acceptable value range: From 0 to 86400
WarningSecondsBeforeCleanup = 60

## {seconds} is replaced with the remaining lead time.
# Setting type: String
# Default value: Server cleanup in {seconds} seconds. Pick up dropped items you want to keep.
WarningMessage = Server cleanup in {seconds} seconds. Pick up dropped items you want to keep.

## Lead time for the final warning. Must be less than WarningSecondsBeforeCleanup.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 0 to 86400
FinalWarningSeconds = 10

## {seconds} is replaced with the remaining lead time.
# Setting type: String
# Default value: Server cleanup in {seconds} seconds!
FinalWarningMessage = Server cleanup in {seconds} seconds!

## Announce the result to players after a pass finishes.
# Setting type: Boolean
# Default value: false
CleanupCompleteMessageEnabled = false

## Text placed in front of every announcement, so players can see it came from the server. Leave empty for no prefix.
# Setting type: String
# Default value: [Server]
AnnouncementPrefix = [Server]

## Where announcements appear on screen. TopLeft is the small corner notice used for pickups; it is also written to the player's in-game message log, so it can be read after the fact. Center is the large banner Valheim uses for messages like "You are cold"; it is louder but vanishes after a few seconds and leaves no record.
# Setting type: String
# Default value: TopLeft
# Acceptable values: TopLeft, Center
AnnouncementStyle = TopLeft

[Admin]

## Let server admins run cleanup commands by typing them in in-game chat. Only accounts listed in adminlist.txt are obeyed, and the check uses the connection's authenticated platform ID rather than the display name carried in the message. Vanilla clients need no mod for this.
# Setting type: Boolean
# Default value: true
EnableChatCommands = true

## Text an admin types in chat to run a command, for example: !autocleanup status
# Setting type: String
# Default value: !autocleanup
ChatCommandPrefix = !autocleanup

## Watch a plain text file for commands. Write a command into it with your host's file manager (DatHost, FTP, ...) and the plugin runs it, then clears the file. This is the most reliable control channel on a rented dedicated server.
# Setting type: Boolean
# Default value: true
EnableCommandFile = true

[Logging]

## Log a one-line summary after each pass.
# Setting type: Boolean
# Default value: true
LogCleanupSummary = true

## Log every individual removal with prefab name, stack size and position. Verbose.
# Setting type: Boolean
# Default value: false
LogDeletedItems = false

## Log every individual item that was kept, and why. Very verbose; use for tuning only.
# Setting type: Boolean
# Default value: false
LogProtectedItems = false

## Extra diagnostics about scanning, prefab classification and network state.
# Setting type: Boolean
# Default value: false
LogDebugInformation = false
